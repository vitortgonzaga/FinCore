name: CI
on:
  push:
      branches:
        - main
  pull_request:
      branches:
        - main

permissions:
    contents: read

jobs:
  ci:
    name : Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode verify